<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>CarMa Project</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="forgot-password-page">
    <nav class="navbar navbar-expand-md py-3" data-bs-theme="dark">
        <div class="container">
            <div class="container main-nav">
                <a href="index.html">
                    <img class="nav-logo" src="/assets/img/UpdatedLogo.webp" width="" height="au">
                </a>
                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navcol-2">
                    <span class="visually-hidden">Toggle navigation</span>
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="collapse navbar-collapse nav-login" id="navcol-2">
                <ul class="navbar-nav ms-auto nav-login">
                    <li class="nav-item"></li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="register.html" style="border-color: var(--bs-light);">Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="forgot-password-section">
        <div class="container forgot-password-container">
            <div class="forgot-password-heading">
                <h1>Reset Your Password</h1>
                <p>Enter your email address to receive a password reset link.</p>
            </div>
            <div class="forgot-password-card">
                <!-- Display password reset errors -->
                 {% if error %}
                 <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
                {% endif %}
                <form method="POST" action="/forgot-password.html">

                <div class="reset-form-group">
                    <label class="form-label reset-label">
                        Email Address
                        <input type="email" class="reset-input" name="email" placeholder="Enter your email address" required>
                    </label>
                </div>

                <button class="btn btn-primary reset-submit-btn" type="submit">Send Reset Link</button>

                {% if success %}
                <div class="reset-message">
                    <svg class="bi bi-info-circle-fill reset-message-icon" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2"></path>
                    </svg>
                    <p class="reset-message-text">{{ success }}</p>
                </div>
                {% endif %}
             </form>
            </div>
            <div class="return-login">
                <a class="return-login-link" href="login.html">
                    <br>
                    ← Return to Login
                    <br>
                    <br>
                </a>
            </div>
        </div>
    </section>
    <footer class="text-center" data-bs-theme="dark">
        <div class="container py-4 py-lg-5">
            <ul class="list-inline">
                <li class="list-inline-item me-4">
                    <a class="link-body-emphasis" href="#">About</a>
                </li>
                <li class="list-inline-item me-4">
                    <a class="link-body-emphasis" href="#">Privacy</a>
                </li>
                <li class="list-inline-item">
                    <a class="link-body-emphasis" href="#">Contact</a>
                </li>
            </ul>
            <p class="text-body mb-0">Copyright © 2026 CarMa</p>
        </div>
    </footer>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
</body>

</html>
