<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Reset Password - CarMa</title>
    <link rel="stylesheet" href="/assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>

<body class="forgot-password-page">
    <nav class="navbar navbar-expand-md py-3" data-bs-theme="dark">
        <div class="container">
            <div class="container main-nav">
                <a href="index.html">
                    <img class="nav-logo" src="/assets/img/UpdatedLogo.webp" width="" height="au">
                </a>
                <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navcol-2">
                    <span class="visually-hidden">Toggle navigation</span>
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
            <div class="collapse navbar-collapse nav-login" id="navcol-2">
                <ul class="navbar-nav ms-auto nav-login">
                    <li class="nav-item"></li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="register.html" style="border-color: var(--bs-light);">Register</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <section class="forgot-password-section">
        <div class="container forgot-password-container">
            <div class="forgot-password-heading">
                <h1>Reset Your Password</h1>
                <p>Enter your new password below to reset your CarMa account password.</p>
            </div>
            <div class="forgot-password-card">
                <form method="POST" action="/reset-password">
    <input type="hidden" name="token" value="{{ token }}">
    <div class="reset-form-group">
    <label class="reset-label" for="password">New Password</label>
    <input type="password" class="reset-input" id="password" name="password" placeholder="Enter new password" required>
</div>

<div class="reset-form-group">
    <label class="reset-label" for="confirm_password">Confirm New Password</label>
    <input type="password" class="reset-input" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
</div>
    
    <button class="btn btn-primary reset-submit-btn" type="submit">Reset Password</button>
    {% if error %}
    <p class="text-danger mt-3">{{ error }}</p>
    {% endif %}
</form>
            </div>
            <div class="return-login">
                <a class="return-login-link" href="login.html">
                    <br>
                    ← Return to Login
                    <br>
                    <br>
                </a>
            </div>
        </div>
    </section>
    <footer class="text-center" data-bs-theme="dark">
        <div class="container py-4 py-lg-5">
            <ul class="list-inline">
                <li class="list-inline-item me-4">
                    <a class="link-body-emphasis" href="#">About</a>
                </li>
                <li class="list-inline-item me-4">
                    <a class="link-body-emphasis" href="#">Privacy</a>
                </li>
                <li class="list-inline-item">
                    <a class="link-body-emphasis" href="#">Contact</a>
                </li>
            </ul>
            <p class="text-body mb-0">Copyright © 2026 CarMa</p>
        </div>
    </footer>
<script src="/assets/bootstrap/js/bootstrap.min.js"></script>
</body>

</html>
